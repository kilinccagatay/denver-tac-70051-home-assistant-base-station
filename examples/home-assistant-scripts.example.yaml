# Example entries for Home Assistant's scripts.yaml.
# Replace vacuum.example_robot with your own vacuum entity.
# Supported actions vary by integration; test them in Developer Tools first.

example_vacuum_start:
  alias: Wall panel - Start vacuum
  icon: mdi:play-circle
  mode: single
  sequence:
    - action: vacuum.start
      target:
        entity_id: vacuum.example_robot

example_vacuum_stop:
  alias: Wall panel - Stop vacuum
  icon: mdi:stop-circle
  mode: single
  sequence:
    - action: vacuum.stop
      target:
        entity_id: vacuum.example_robot

example_vacuum_dock:
  alias: Wall panel - Return vacuum to dock
  icon: mdi:home-map-marker
  mode: single
  sequence:
    - action: vacuum.return_to_base
      target:
        entity_id: vacuum.example_robot
